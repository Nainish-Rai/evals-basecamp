services:
  minio:
    container_name: workspace-agent-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio-data:/data
    networks:
      - workspace-agent-network
    restart: always

  minio-init:
    container_name: workspace-agent-minio-init
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin123}; do sleep 2; done &&
      mc mb -p local/${AGENT_ARTIFACTS_BUCKET:-research-platform-bucket} || true &&
      mc anonymous set download local/${AGENT_ARTIFACTS_BUCKET:-research-platform-bucket} || true &&
      mc mb -p local/${AGENT_TRACE_BUCKET:-workspace-agent-traces-private} || true
      "
    networks:
      - workspace-agent-network
    restart: "no"

  agent-executor:
    container_name: workspace-agent-executor
    build:
      context: ./agent-executor
    env_file:
      - .env
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9000
      - TRACE_ROOT=/traces
      - WORKSPACE_ROOT=/workspace
      - AGENT_EXECUTOR_PORT=8010
      - AGENT_ARTIFACTS_BUCKET=${AGENT_ARTIFACTS_BUCKET:-research-platform-bucket}
      - AGENT_TRACE_BUCKET=${AGENT_TRACE_BUCKET:-workspace-agent-traces-private}
      - WORKSPACE_AGENT_MODEL=${WORKSPACE_AGENT_MODEL:-${OPENAI_MODEL:-gpt-4o-mini}}
      - COMPLIANCE_SUBAGENT_MODEL=${COMPLIANCE_SUBAGENT_MODEL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:4000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "${AGENT_EXECUTOR_PORT:-8010}:8010"
    volumes:
      - agent-workspaces:/workspace
      - ./IIFL-artifacts:/workspace/imports/IIFL-artifacts:ro
      - ./traces:/traces
    depends_on:
      - minio-init
    networks:
      - workspace-agent-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

networks:
  workspace-agent-network:

volumes:
  agent-workspaces:
  minio-data:
