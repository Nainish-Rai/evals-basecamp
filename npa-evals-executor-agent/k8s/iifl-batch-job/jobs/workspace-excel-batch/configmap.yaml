apiVersion: v1
kind: ConfigMap
metadata:
  name: workspace-excel-batch-script
  labels:
    app.kubernetes.io/name: workspace-excel-batch
    app.kubernetes.io/part-of: workspace-agent
data:
  runner.py: |
    import json
    import os
    import re
    import sys
    import tempfile
    import time
    import uuid
    from pathlib import Path
    from typing import Any
    from urllib.parse import urlparse

    import boto3
    import httpx
    import pandas as pd


    TERMINAL_BATCH_STATUSES = {"completed", "completed_with_errors", "failed"}


    def getenv_required(name: str) -> str:
        value = os.getenv(name, "").strip()
        if not value:
            raise RuntimeError(f"Missing required environment variable: {name}")
        return value


    def getenv_bool(name: str, default: bool = False) -> bool:
        value = os.getenv(name)
        if value is None:
            return default
        return value.strip().lower() in {"1", "true", "yes", "on"}


    def getenv_float(name: str, default: float) -> float:
        value = os.getenv(name)
        if value is None or not value.strip():
            return default
        return float(value)


    def getenv_int(name: str, default: int) -> int:
        value = os.getenv(name)
        if value is None or not value.strip():
            return default
        return int(value)


    def parse_csv_env(name: str) -> list[str]:
        raw = os.getenv(name, "")
        return [part.strip() for part in raw.split(",") if part.strip()]


    def build_selected_files() -> list[dict[str, Any]]:
        selected_file_name = os.getenv("SELECTED_FILE_NAME", "").strip()
        staged_path = os.getenv("SELECTED_FILE_WORKSPACE_STAGED_PATH", "").strip()
        file_url = os.getenv("SELECTED_FILE_URL", "").strip()
        if not selected_file_name:
            return []
        if not staged_path and not file_url:
            raise RuntimeError("Set SELECTED_FILE_WORKSPACE_STAGED_PATH or SELECTED_FILE_URL when SELECTED_FILE_NAME is provided")
        return [
            {
                "file_id": os.getenv("SELECTED_FILE_ID", "workspace-selected-file").strip() or "workspace-selected-file",
                "file_name": selected_file_name,
                "file_url": file_url,
                "file_type": os.getenv("SELECTED_FILE_TYPE", "text").strip() or "text",
                "relative_path": os.getenv("SELECTED_FILE_RELATIVE_PATH", selected_file_name).strip() or selected_file_name,
                "workspace_staged_path": staged_path or None,
                "preprocessing_skipped": getenv_bool("SELECTED_FILE_PREPROCESSING_SKIPPED", True),
                "source_type": "workspace_staged" if staged_path else "remote",
            }
        ]


    def safe_sheet_name(name: str) -> str:
        cleaned = re.sub(r"[:\\\\/?*\\[\\]]", "-", name).strip()
        return (cleaned or "Sheet")[:31]


    def sanitize_item_fragment(value: Any) -> str:
        text = str(value or "").strip()
        text = re.sub(r"[^A-Za-z0-9._-]+", "-", text)
        return text.strip("-") or "row"


    def parse_s3_uri(uri: str) -> tuple[str, str]:
        parsed = urlparse(uri)
        if parsed.scheme != "s3" or not parsed.netloc or not parsed.path:
            raise RuntimeError(f"Invalid S3 URI: {uri}")
        return parsed.netloc, parsed.path.lstrip("/")


    def build_s3_client():
        endpoint = os.getenv("MINIO_ENDPOINT", "").rstrip("/")
        access_key = os.getenv("MINIO_ACCESS_KEY", "")
        secret_key = os.getenv("MINIO_SECRET_KEY", "")
        region = os.getenv("AWS_REGION", "ap-south-1")
        session = boto3.session.Session()
        kwargs = {
            "service_name": "s3",
            "aws_access_key_id": access_key,
            "aws_secret_access_key": secret_key,
            "region_name": region,
        }
        if endpoint:
            kwargs["endpoint_url"] = endpoint
        return session.client(**kwargs)


    def download_input_workbook() -> Path:
        local_path = os.getenv("INPUT_XLSX_PATH", "").strip()
        if local_path:
            path = Path(local_path)
            if not path.exists():
                raise RuntimeError(f"INPUT_XLSX_PATH does not exist: {path}")
            return path

        temp_dir = Path(tempfile.mkdtemp(prefix="workspace-excel-batch-"))
        temp_path = temp_dir / "input.xlsx"

        s3_uri = os.getenv("INPUT_XLSX_S3_URI", "").strip()
        if s3_uri:
            bucket, key = parse_s3_uri(s3_uri)
            build_s3_client().download_file(bucket, key, str(temp_path))
            return temp_path

        url = os.getenv("INPUT_XLSX_URL", "").strip()
        if url:
            timeout = httpx.Timeout(getenv_float("REQUEST_TIMEOUT_SECONDS", 1800.0))
            verify = not getenv_bool("INSECURE_SKIP_TLS_VERIFY", False)
            with httpx.Client(timeout=timeout, verify=verify, follow_redirects=True) as client:
                response = client.get(url)
                response.raise_for_status()
                temp_path.write_bytes(response.content)
            return temp_path

        raise RuntimeError("Provide one of INPUT_XLSX_PATH, INPUT_XLSX_S3_URI, or INPUT_XLSX_URL")


    def clean_value(value: Any) -> Any:
        if pd.isna(value):
            return None
        if hasattr(value, "isoformat"):
            try:
                return value.isoformat()
            except Exception:
                pass
        return value


    def load_rows(workbook_path: Path) -> tuple[list[dict[str, Any]], dict[str, pd.DataFrame]]:
        requested_sheet = os.getenv("INPUT_XLSX_SHEET_NAME", "").strip()
        if requested_sheet:
            sheets = {requested_sheet: pd.read_excel(workbook_path, sheet_name=requested_sheet)}
        else:
            sheets = pd.read_excel(workbook_path, sheet_name=None)

        rows: list[dict[str, Any]] = []
        for sheet_name, dataframe in sheets.items():
            dataframe = dataframe.copy()
            header_row_number = 1
            for index, record in enumerate(dataframe.to_dict(orient="records")):
                cleaned = {str(key): clean_value(value) for key, value in record.items()}
                non_empty = {
                    key: value for key, value in cleaned.items()
                    if value not in (None, "", [])
                }
                if not non_empty:
                    continue
                excel_row_number = index + header_row_number + 1
                row_id_column = os.getenv("ROW_ID_COLUMN", "").strip()
                row_id_value = cleaned.get(row_id_column) if row_id_column else None
                rows.append(
                    {
                        "sheet_name": sheet_name,
                        "sheet_index": index,
                        "excel_row_number": excel_row_number,
                        "row_id": row_id_value if row_id_value not in (None, "") else excel_row_number,
                        "record": cleaned,
                    }
                )
        return rows, sheets


    def build_items(rows: list[dict[str, Any]]) -> list[dict[str, str]]:
        question_column = os.getenv("QUESTION_COLUMN", "").strip()
        prompt_template = os.getenv("PROMPT_TEMPLATE", "").strip()
        items: list[dict[str, str]] = []
        for row in rows:
            record = row["record"]
            question = ""
            if question_column and question_column in record:
                candidate = record.get(question_column)
                if candidate not in (None, ""):
                    question = str(candidate).strip()
            if not question:
                question = prompt_template.format(
                    sheet_name=row["sheet_name"],
                    excel_row_number=row["excel_row_number"],
                    row_id=row["row_id"],
                    row_json=json.dumps(record, ensure_ascii=False, default=str),
                    task_json=json.dumps(record, ensure_ascii=False, indent=2, default=str),
                ).strip()
            if not question:
                raise RuntimeError(
                    f"Unable to derive question for sheet={row['sheet_name']} excel_row={row['excel_row_number']}"
                )
            item_id = (
                f"{sanitize_item_fragment(row['sheet_name'])}"
                f"-row-{row['excel_row_number']}"
                f"-{sanitize_item_fragment(row['row_id'])}"
            )
            items.append({"item_id": item_id, "question": question})
        return items


    def submit_batch(client: httpx.Client, base_url: str, items: list[dict[str, str]]) -> dict[str, Any]:
        batch_id_prefix = os.getenv("BATCH_ID_PREFIX", "workspace-excel-batch").strip() or "workspace-excel-batch"
        thread_id_prefix = os.getenv("THREAD_ID_PREFIX", batch_id_prefix).strip() or batch_id_prefix
        unique_suffix = uuid.uuid4().hex[:12]
        batch_id = f"{batch_id_prefix}-{unique_suffix}"
        thread_id = f"{thread_id_prefix}-{unique_suffix}"
        selected_files = build_selected_files()
        if not selected_files:
            raise RuntimeError("At least one selected file is required for agent-executor batch runs")
        response = client.post(
            f"{base_url}{os.getenv('BATCH_API_PATH', '/batches')}",
            json={
                "batch_id": batch_id,
                "thread_id": thread_id,
                "user_id": os.getenv("AGENT_USER_ID", "workspace-excel-batch").strip() or "workspace-excel-batch",
                "selected_files": selected_files,
                "items": items,
                "model": os.getenv("MODEL") or None,
                "max_concurrency": getenv_int("BATCH_MAX_CONCURRENCY", 15),
            },
        )
        response.raise_for_status()
        return response.json()


    def wait_for_batch(client: httpx.Client, base_url: str, batch_id: str) -> dict[str, Any]:
        poll_interval = getenv_float("BATCH_POLL_INTERVAL_SECONDS", 5.0)
        while True:
            response = client.get(f"{base_url}/batches/{batch_id}")
            response.raise_for_status()
            payload = response.json()
            status = payload.get("status")
            counts = payload.get("counts", {})
            print(
                json.dumps(
                    {
                        "batch_id": payload.get("batch_id"),
                        "status": status,
                        "counts": counts,
                    },
                    ensure_ascii=False,
                ),
                flush=True,
            )
            if status in TERMINAL_BATCH_STATUSES:
                return payload
            time.sleep(poll_interval)


    def merge_results(rows: list[dict[str, Any]], items: list[dict[str, str]], summary: dict[str, Any]) -> dict[str, pd.DataFrame]:
        item_results = {item["item_id"]: item for item in summary.get("items", [])}
        grouped_rows: dict[str, list[dict[str, Any]]] = {}
        for row, item in zip(rows, items):
            result = item_results.get(item["item_id"], {})
            record = dict(row["record"])
            record["workspace_item_id"] = item["item_id"]
            record["workspace_sheet_name"] = row["sheet_name"]
            record["workspace_excel_row_number"] = row["excel_row_number"]
            record["workspace_row_id"] = row["row_id"]
            record["workspace_question"] = item["question"]
            record["workspace_status"] = result.get("status", "missing")
            record["workspace_run_id"] = result.get("run_id")
            record["workspace_answer"] = result.get("final_answer")
            record["workspace_error"] = result.get("error")
            record["workspace_log_path"] = result.get("log_path")
            record["workspace_artifact_count"] = len(result.get("artifacts", []))
            record["workspace_artifact_urls"] = "\n".join(
                artifact.get("url", "") for artifact in result.get("artifacts", []) if artifact.get("url")
            )
            grouped_rows.setdefault(row["sheet_name"], []).append(record)
        return {sheet_name: pd.DataFrame(records) for sheet_name, records in grouped_rows.items()}


    def write_output(summary: dict[str, Any], result_frames: dict[str, pd.DataFrame]) -> Path:
        output_path = Path(os.getenv("OUTPUT_XLSX_PATH", "/tmp/workspace-batch-results.xlsx"))
        output_path.parent.mkdir(parents=True, exist_ok=True)
        prefix = os.getenv("OUTPUT_SHEET_PREFIX", "results").strip() or "results"
        with pd.ExcelWriter(output_path, engine="openpyxl") as writer:
            summary_frame = pd.DataFrame(
                [
                    {
                        "batch_id": summary.get("batch_id"),
                        "status": summary.get("status"),
                        "item_count": summary.get("item_count"),
                        "completed": summary.get("counts", {}).get("completed"),
                        "failed": summary.get("counts", {}).get("failed"),
                        "pending": summary.get("counts", {}).get("pending"),
                        "in_progress": summary.get("counts", {}).get("in_progress"),
                        "max_concurrency": summary.get("max_concurrency"),
                        "created_at": summary.get("created_at"),
                        "started_at": summary.get("started_at"),
                        "completed_at": summary.get("completed_at"),
                    }
                ]
            )
            summary_frame.to_excel(writer, sheet_name="summary", index=False)
            for sheet_name, dataframe in result_frames.items():
                dataframe.to_excel(
                    writer,
                    sheet_name=safe_sheet_name(f"{prefix}-{sheet_name}"),
                    index=False,
                )
        return output_path


    def maybe_upload_output(output_path: Path) -> str | None:
        output_s3_uri = os.getenv("OUTPUT_S3_URI", "").strip()
        if not output_s3_uri:
            return None
        bucket, key = parse_s3_uri(output_s3_uri)
        build_s3_client().upload_file(str(output_path), bucket, key)
        return output_s3_uri


    def main() -> int:
        workbook_path = download_input_workbook()
        rows, _sheets = load_rows(workbook_path)
        if not rows:
            raise RuntimeError("No non-empty rows found in workbook")
        items = build_items(rows)

        base_url = os.getenv("EXECUTOR_BASE_URL", "").rstrip("/")
        if not base_url:
            raise RuntimeError("EXECUTOR_BASE_URL must be set")

        timeout = httpx.Timeout(getenv_float("REQUEST_TIMEOUT_SECONDS", 1800.0))
        verify = not getenv_bool("INSECURE_SKIP_TLS_VERIFY", False)
        with httpx.Client(timeout=timeout, verify=verify, follow_redirects=True) as client:
            batch = submit_batch(client, base_url, items)
            summary = wait_for_batch(client, base_url, batch["batch_id"])

        result_frames = merge_results(rows, items, summary)
        output_path = write_output(summary, result_frames)
        uploaded_to = maybe_upload_output(output_path)
        print(
            json.dumps(
                {
                    "batch_id": summary.get("batch_id"),
                    "status": summary.get("status"),
                    "output_path": str(output_path),
                    "output_s3_uri": uploaded_to,
                },
                ensure_ascii=False,
            ),
            flush=True,
        )

        if summary.get("status") in {"failed", "completed_with_errors"}:
            return 1
        return 0


    if __name__ == "__main__":
        try:
            raise SystemExit(main())
        except Exception as exc:
            print(json.dumps({"error": str(exc)}, ensure_ascii=False), file=sys.stderr, flush=True)
            raise
