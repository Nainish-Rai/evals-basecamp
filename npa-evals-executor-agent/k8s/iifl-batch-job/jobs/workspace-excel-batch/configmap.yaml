apiVersion: v1
kind: ConfigMap
metadata:
  name: workspace-excel-batch-config
  labels:
    app.kubernetes.io/name: workspace-excel-batch
    app.kubernetes.io/part-of: workspace-agent
data:
  EXECUTOR_BASE_URL: "http://agent-executor.iifl-batch-job.svc.cluster.local:8010"
  BATCH_API_PATH: "/batches"
  BATCH_POLL_INTERVAL_SECONDS: "5"
  BATCH_MAX_CONCURRENCY: "15"
  BATCH_ID_PREFIX: "workspace-excel-batch"
  THREAD_ID_PREFIX: "workspace-excel-batch"
  AGENT_USER_ID: "workspace-excel-batch"
  INPUT_XLSX_PATH: ""
  INPUT_XLSX_URL: ""
  INPUT_XLSX_S3_URI: "s3://research-platform-bucket/workspace-batch-inputs/obligation-register-without-risk-20260316-sheet1-2.xlsx"
  INPUT_XLSX_SHEET_NAME: ""
  QUESTION_COLUMN: ""
  ROW_ID_COLUMN: "Sr. No."
  SELECTED_FILE_ID: "workspace-iifl-artifacts"
  SELECTED_FILE_NAME: "IIFL-artifacts"
  SELECTED_FILE_TYPE: "workspace_folder"
  SELECTED_FILE_RELATIVE_PATH: "IIFL-artifacts"
  SELECTED_FILE_WORKSPACE_STAGED_PATH: "IIFL-artifacts"
  SELECTED_FILE_PREPROCESSING_SKIPPED: "true"
  MODEL: "anthropic/claude-sonnet-4-5-20250929"
  OUTPUT_XLSX_PATH: "/tmp/workspace-batch-results.xlsx"
  OUTPUT_S3_URI: "s3://research-platform-bucket/workspace-batch-results/obligation-register-without-risk-20260316-sheet1-2-results.xlsx"
  OUTPUT_SHEET_PREFIX: "results"
  REQUEST_TIMEOUT_SECONDS: "1800"
  PROMPT_TEMPLATE: |
    Please read the instructions present in IIFL-artifacts/instructions.txt for the following task.


    As the final deliverable of your Deepresearch please generate me an artifact(JSON) of the following schema, always review the final deliverable before concluding.
    Citation rules — every citation object must follow this exact structure:
    * document_name: The exact filename of the cited source and nothing else. Do not paraphrase, shorten, normalize, or invent a document title. For local workspace files, use the precise basename exactly as it appears in the workspace (for example "instructions.txt" or "20260316_135848_Compliance_Testing_Results_Q2-FY25-26.txt"). For web sources, use the exact filename from the URL path when one exists.
    * page_or_section: The most precise location available from the source, such as paragraph, section, page, heading, line range, or search position. Do not use vague values like "N/A", "Multiple documents searched", or "Various sources reviewed".
    * excerpt: A short verbatim extract (2–5 sentences max) from that document that directly supports the value assigned — must be meaningful and specific, not generic
    * url: Full URL of the source, or the exact relative workspace file path if the source is a local document (for example "IIFL-artifacts/instructions.txt" or "IIFL-artifacts/extracted_text_from_pdf/IIFL-artifacts/uploads/20260316_140029_Compliance_Testing_Results_Q3-FY25-26.txt"). Do not use placeholder paths, directory-only paths, inferred paths, or "N/A" when a real source was used.
    Hard citation requirements:
    * If you cite a local file from the workspace, the document_name must exactly match the final filename segment of the cited path in url.
    * If you cite a web source, the document_name must exactly match the final filename segment of the URL path when available; otherwise use the most specific trailing path segment.
    * Never use generic labels like "RBI Circular", "Master Direction", "Compliance Risk Assessment Methodology", "Assessment Note", "Task Data", "Industry-wide search", "Available Documentation Review", or any other human-friendly renamed title in document_name unless that exact text is the real filename.
    * Never fabricate a citation. If you cannot identify the exact source filename/path, do not include that citation.
    * Never cite your own reasoning, your own summaries, the row input/task JSON, generated artifacts, generated analysis scripts, or a directory path as evidence.
    * A citation must point to a concrete source file, not a folder.
    Rules for missing evidence:
    * If the workspace does not contain evidence for a field, say so explicitly in the value using wording like "Insufficient evidence in provided workspace" or "No evidence found in reviewed workspace files". In that case, citations must be an empty array.
    * Do not use fake support citations for "Not Found", "Not Applicable", or "Insufficient evidence" conclusions.
    Field-specific evidence rules:
    * For regulatory obligation fields, customer impact fields, embargo/penalty/license-cancellation fields, and additional RBI requirements, cite only the actual regulation, circular, press release, inspection record, or extracted text file that directly supports the conclusion.
    * For company-specific control-risk fields, cite only IIFL-specific workspace evidence such as compliance testing files, policy documents, SOPs, observation trackers, internal audit files, reporting logs, or other actual IIFL documents present in the workspace. If those documents are not available, state that evidence is insufficient and use no citations.
    * For score/rating fields derived from the methodology, cite "instructions.txt" for the scoring rule and separately cite the underlying evidence file that drove the score whenever available.
    Final validation before answering:
    * Re-check every citation object and delete any citation whose document_name is not an exact filename, whose url is not an exact file path/URL, or whose excerpt does not literally appear in that cited source.
    Workspace usage requirements:
    * Use all relevant evidence available in the provided workspace, not just one subfolder or one preprocessed corpus.
    * Relevant evidence may come from uploads, extracted_text_from_pdf, pdfs, policy documents, SOPs, compliance testing files, spreadsheets, internal trackers, and other workspace files.
    * Do not prefer `pdfs/` over `uploads/`, and do not prefer extracted text over the original source by default. Use whichever source gives the best direct evidence for the field.
    * If a relevant document exists only as a PDF or other binary file and no extracted text file is available, open/read the original file directly and extract the needed text before concluding that evidence is unavailable.
    * If both an original PDF and an extracted text version exist, you may use either or both, but the citation must still point to the exact file you actually used.
    * Do not ignore a relevant source just because it is not already converted to `.txt`.
    * If a file cannot be parsed or read successfully, say that explicitly in your reasoning and do not pretend the evidence was reviewed.

    {{
      "RBI penalties on other Banks/ NBFCs/ HFCs (Industry Level)": {{
        "value": "",
        "citations": [
          {{ "document_name": "", "page_or_section": "", "excerpt": "", "url": "" }}
        ]
      }},
      "In the event where RBI has imposed embargo the business (Industry Level)": {{
        "value": "",
        "citations": [
          {{ "document_name": "", "page_or_section": "", "excerpt": "", "url": "" }}
        ]
      }},
      "In the event where RBI has ordered for cancellation of license (Industry Level)": {{
        "value": "",
        "citations": [
          {{ "document_name": "", "page_or_section": "", "excerpt": "", "url": "" }}
        ]
      }},
      "Guidelines relates to customer impact": {{
        "value": "",
        "citations": [
          {{ "document_name": "", "page_or_section": "", "excerpt": "", "url": "" }}
        ]
      }},
      "Any other RBI requirements not covered above": {{
        "value": "",
        "citations": [
          {{ "document_name": "", "page_or_section": "", "excerpt": "", "url": "" }}
        ]
      }},
      "Impact Score (Highest of Score of all Impact Categories)": {{
        "value": "",
        "citations": [
          {{ "document_name": "", "page_or_section": "", "excerpt": "", "url": "" }}
        ]
      }},
      "Impact Rating": {{
        "value": "",
        "citations": [
          {{ "document_name": "", "page_or_section": "", "excerpt": "", "url": "" }}
        ]
      }},
      "Likelihood Score": {{
        "value": "",
        "citations": [
          {{ "document_name": "", "page_or_section": "", "excerpt": "", "url": "" }}
        ]
      }},
      "Likelihood Rating": {{
        "value": "",
        "citations": [
          {{ "document_name": "", "page_or_section": "", "excerpt": "", "url": "" }}
        ]
      }},
      "Inherent Risk Rating": {{
        "value": "",
