apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-executor-workspace-pvc
  labels:
    app.kubernetes.io/part-of: npa-evals
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: gp3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-executor-traces-pvc
  labels:
    app.kubernetes.io/part-of: npa-evals
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: gp3
